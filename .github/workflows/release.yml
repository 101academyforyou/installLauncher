name: release

# 編譯電腦小幫手（macOS 通用版、Linux x86_64），發佈到 GitHub Release v<版本>。
# install-launcher.sh 會下載最新版：
#   https://github.com/101academyforyou/installLauncher/releases/latest/download/watchlaterhub-launcher-macos
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --release --manifest-path launcher/Cargo.toml
      - name: Build universal binary
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --manifest-path launcher/Cargo.toml --target "$t"
          done
          mkdir -p dist
          lipo -create -output dist/watchlaterhub-launcher-macos \
            launcher/target/aarch64-apple-darwin/release/watchlaterhub-launcher \
            launcher/target/x86_64-apple-darwin/release/watchlaterhub-launcher
          codesign --force --sign - dist/watchlaterhub-launcher-macos
          (cd dist && shasum -a 256 watchlaterhub-launcher-macos > watchlaterhub-launcher-macos.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --release --manifest-path launcher/Cargo.toml
      - name: Build static binary
        run: |
          cargo build --release --manifest-path launcher/Cargo.toml --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp launcher/target/x86_64-unknown-linux-musl/release/watchlaterhub-launcher dist/watchlaterhub-launcher-linux-x86_64
          (cd dist && sha256sum watchlaterhub-launcher-linux-x86_64 > watchlaterhub-launcher-linux-x86_64.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  release:
    needs: [mac, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Read version
        id: ver
        run: echo "v=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      # 每個版本一個 Release（版本號在 launcher/Cargo.toml）；同版本再發佈會覆蓋檔案
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 電腦小幫手 v${{ steps.ver.outputs.v }}
          body: |
            WatchLaterHub「開啟」功能需要的電腦小幫手。安裝：打開終端機，貼上

            ```
            curl -fsSL https://raw.githubusercontent.com/101academyforyou/installLauncher/main/install-launcher.sh | bash
            ```

            移除：同一行最後加上 `-s -- --uninstall`
          files: |
            dist/watchlaterhub-launcher-macos
            dist/watchlaterhub-launcher-macos.sha256
            dist/watchlaterhub-launcher-linux-x86_64
            dist/watchlaterhub-launcher-linux-x86_64.sha256
          overwrite_files: true
          make_latest: true
